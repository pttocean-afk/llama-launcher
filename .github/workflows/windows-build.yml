name: Windows build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Build portable app
        shell: powershell
        # Test 已在上一個 step 跑過；避免同一 Windows runner 重複初始化 Tk/Tcl。
        run: .\scripts\build-windows.ps1 -SkipTests
      - name: Build installer
        shell: powershell
        run: .\scripts\build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LlamaLauncher-Windows-x64
          path: |
            dist/LlamaLauncher-Portable-*-x64.zip
            dist/LlamaLauncher-Setup-*-x64.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LlamaLauncher-Portable-*-x64.zip
            dist/LlamaLauncher-Setup-*-x64.exe
