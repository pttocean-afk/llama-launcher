name: Linux build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv xvfb
      - name: Create system-Python build environment
        run: python3 -m venv .venv-build
      - name: Build and test
        run: PATH="$PWD/.venv-build/bin:$PATH" bash scripts/build-linux.sh
      - name: Smoke-test Linux executable
        run: |
          mkdir -p /tmp/llama-launcher-smoke/models
          touch /tmp/llama-launcher-smoke/llama-server
          chmod +x /tmp/llama-launcher-smoke/llama-server
          mkdir -p /tmp/llama-launcher-data
          printf '{"llama_dir":"/tmp/llama-launcher-smoke"}\n' > /tmp/llama-launcher-data/settings.json
          printf '{"profiles":[]}\n' > /tmp/llama-launcher-data/profiles.json
          LLAMA_LAUNCHER_DATA_DIR=/tmp/llama-launcher-data xvfb-run -a dist/LlamaLauncher/LlamaLauncher &
          APP_PID=$!
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/ | grep -q 'Llama Launcher Control'
          kill "$APP_PID" || true
      - uses: actions/upload-artifact@v4
        with:
          name: LlamaLauncher-Linux-x86_64
          path: dist/LlamaLauncher-Linux-x86_64.tar.gz
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LlamaLauncher-Linux-x86_64.tar.gz
